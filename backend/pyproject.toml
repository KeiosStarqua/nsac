[project]
name = "nsac"
version = "0.1.0"
description = "HKT — offline astronaut health monitor for NASA Space Apps 2026"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "jinja2>=3.1",
    "numpy>=2.1",
]

[dependency-groups]
# Agent 1 — data, detection, score
data = [
    "pandas>=2.2",
    "statsmodels>=0.14",
    "ruptures>=1.1",
    "httpx>=0.27",
]
# Agent 2 — agent, RAG, report (optional extras)
agent = [
    "langgraph>=0.2",
    "langgraph-checkpoint-sqlite>=2.0",
    "chromadb>=0.5",
    "weasyprint>=63",
]
# Agent 3 — UI
ui = [
    "nicegui>=2.10",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[tool.uv]
default-groups = ["dev"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nsac"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["../tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
