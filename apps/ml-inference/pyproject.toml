[project]
name = "sky-inference"
version = "1.0.0"
description = "Sky ML inference service — HTTP predictions over the trained sky_ml artifacts in data/3_models"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    # Đúng bộ thư viện đã tạo ra artifact (data/pyproject.toml + manifest của từng run).
    # sklearn/lightgbm PIN CỨNG: joblib mở pickle cần đúng API/lớp; nâng cấp = phải train lại.
    "scikit-learn==1.9.1",
    "lightgbm==4.7.0",
    "numpy>=2.1",
    "pandas>=2.2",
    "scipy>=1.14",
    "joblib>=1.4",
    "pyyaml>=6.0",
    # Chỉ thêm phần HTTP — không đụng version của bộ trên.
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.9",
]

[dependency-groups]
dev = ["pytest>=8.3", "httpx>=0.27", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sky_inference"]

# sky_ml KHÔNG phải dependency của package này: nó là mã nguồn thuần trong submodule data/
# (xem src/sky_inference/config.py — SKY_ML_SRC). Lý do: khai báo path source sẽ kéo cả bộ
# dependency TRAIN của data/pyproject.toml (mne, shap, matplotlib) vào venv deploy, và làm
# hash của FOD nix phụ thuộc nội dung data/ thay vì chỉ phụ thuộc uv.lock.
[tool.uv]
package = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "cli_parity: chạy sky-ml CLI thật trong cây dữ liệu copy tạm (cần submodule data/)",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
